<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#0B0D0F" stroke="#0B0D0F"/><rect x="0" y="0" width="1440" height="40" rx="0" fill="#0F1114" stroke="#30363D"/><text x="18" y="26" fill="#F1F4F6" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="650" text-anchor="start">Koffer</text><text x="220" y="26" fill="#66717C" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="450" text-anchor="start">First Run</text><text x="1418" y="26" fill="#67B983" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" text-anchor="end">●</text><rect x="250" y="150" width="940" height="600" rx="10" fill="#121518" stroke="#30363D"/><text x="720" y="236" fill="#E7A36F" font-family="Inter,DejaVu Sans,sans-serif" font-size="30" font-weight="800" text-anchor="middle">KOFFER</text><text x="720" y="280" fill="#F1F4F6" font-family="Inter,DejaVu Sans,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Your local sample library, organized.</text><text x="720" y="314" fill="#98A2AD" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="450" text-anchor="middle">Index what you already have. Nothing moves until you tell Koffer to move it.</text><rect x="340" y="370" width="220" height="150" rx="8" fill="#181C20" stroke="#30363D"/><text x="450" y="410" fill="#E7A36F" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="700" text-anchor="middle">FILES STAY PUT</text><text x="450" y="444" fill="#F1F4F6" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Scanning only indexes</text><text x="450" y="468" fill="#98A2AD" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" text-anchor="middle">your existing folders.</text><rect x="610" y="370" width="220" height="150" rx="8" fill="#181C20" stroke="#30363D"/><text x="720" y="410" fill="#E7A36F" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="700" text-anchor="middle">BACKGROUND WORK</text><text x="720" y="444" fill="#F1F4F6" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Browse while Koffer</text><text x="720" y="468" fill="#98A2AD" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" text-anchor="middle">scans and analyzes.</text><rect x="880" y="370" width="220" height="150" rx="8" fill="#181C20" stroke="#30363D"/><text x="990" y="410" fill="#E7A36F" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="700" text-anchor="middle">LOCAL FIRST</text><text x="990" y="444" fill="#F1F4F6" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Core library use</text><text x="990" y="468" fill="#98A2AD" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" text-anchor="middle">works offline.</text><rect x="610" y="580" width="139.2" height="32" rx="5" fill="#CF8652" stroke="#CF8652"/><text x="679.6" y="601" fill="#0B0D0F" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="650" text-anchor="middle">Add First Source</text><rect x="756" y="580" width="139.2" height="32" rx="5" fill="#20252A" stroke="#3A4148"/><text x="825.6" y="601" fill="#F1F4F6" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="650" text-anchor="middle">Learn the Basics</text><text x="720" y="670" fill="#66717C" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="450" text-anchor="middle">You can add, disable, or remove Sources later.</text></svg>