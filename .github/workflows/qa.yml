name: qa

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked Grapher control-plane state
        run: make repo-guard

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libpulse0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync frozen core + test dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test
