name: qa

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync frozen dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test
