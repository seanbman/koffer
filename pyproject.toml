[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koffer"
version = "0.1.0"
description = "Local-first Linux desktop application for audio sample libraries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sean" }]
dependencies = [
    "PySide6>=6.6,<6.9",
    "librosa>=0.10,<0.12",
    "mutagen>=1.47,<2",
    "numpy>=1.26,<3",
    "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-qt>=4.4,<5",
    "coverage>=7.5,<8",
    "ruff>=0.6,<0.10",
    "mypy>=1.11,<2",
]
# Optional semantic stack: install via `uv sync --extra semantic`.
# Weights remain out of Git; unit CI uses FakeSemanticProvider + numpy index.
semantic = [
    "torch>=2.2,<3",
    "hnswlib>=0.8,<0.9",
]
# AppImage packaging toolchain (PyInstaller onedir). Not required for runtime users.
packaging = [
    "pyinstaller>=6.3,<7",
]

[project.scripts]
koffer = "koffer.app:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["koffer"]

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mutagen", "mutagen.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["librosa", "librosa.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "hnswlib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"

[tool.coverage.run]
source = ["koffer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.hatch.build.targets.wheel.force-include]
"src/koffer/persistence/migrations" = "koffer/persistence/migrations"
"src/koffer/analysis/models" = "koffer/analysis/models"
"src/koffer/analysis/label_maps" = "koffer/analysis/label_maps"
# models/ includes panns_cnn14.json + audioset_class_labels.json (no weight binaries).
